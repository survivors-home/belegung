<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SURVIVORS HOME – Belegungsplan</title>
<style>
:root{
  --violet:#662483; --violet-2:#AC3F90; --ink:#3C3C3B; --muted:#6f6875; --paper:#ffffff; --surface:#f6f3f8; --line:#e2dbe8;
  --hol:#fbe9ea; --hol-ink:#c0262d; --pause:#d8d3dc; --quiet:#ecebef; --fer:rgba(172,63,144,.12); --r:6px;
  --f:"Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; --mono:ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root{ --violet:#c48ae0; --violet-2:#e27bc8; --ink:#ece8ef; --muted:#a69eae; --paper:#161319; --surface:#201c24; --line:#3a3341; --hol:#3a1c1f; --hol-ink:#ff7b7f; --pause:#2b282f; --quiet:#25222a; --fer:rgba(226,123,200,.14); color-scheme:dark } }
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.logo{display:block;flex:none;width:200px;height:auto;background:#fff;border-radius:4px}
header h1{margin:0;font-size:1.25rem;font-weight:700;color:var(--ink)}
header h1 small{display:block;font-size:.8rem;font-weight:400;color:var(--muted)}
main{max-width:1200px;margin:0 auto;padding:14px 16px 40px}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#navx{display:contents}
.mv{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.btn{border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:var(--r);cursor:pointer;font-weight:700;font-size:.95rem}
.btn[disabled]{opacity:.35;cursor:default}
.seg{display:inline-flex}.seg .btn{border-radius:0}.seg .btn:first-child{border-radius:var(--r) 0 0 var(--r)}.seg .btn:last-child{border-radius:0 var(--r) var(--r) 0;margin-left:-1px}
.seg .btn[aria-pressed="true"]{background:var(--violet);color:#fff;border-color:var(--violet)}
.lab{font-weight:700;font-size:1.1rem;min-width:11ch;text-align:center}
.jump{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;color:var(--muted)}
.jump input{border:1px solid var(--line);background:var(--paper);border-radius:var(--r);padding:6px 8px;font-size:.95rem}
.stand{font-size:.82rem;color:var(--muted)}
.intro{margin:0 0 12px;font-size:.9rem;color:var(--muted);max-width:75ch}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.f{background:var(--c)}
.v{background:repeating-linear-gradient(135deg,var(--c) 0 3px,color-mix(in srgb,var(--c) 28%,var(--paper)) 3px 7px)}
.sw.f,.sw.v{border:1px solid var(--c)}
/* Monat */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wh{font-size:.75rem;font-weight:700;color:var(--muted);text-align:center}
.day{position:relative;display:flex;flex-direction:column;gap:3px;min-height:92px;padding:5px 6px;border:1px solid var(--line);border-radius:var(--r);background:var(--paper);text-align:left;cursor:pointer;min-width:0}
.day:hover{border-color:var(--violet)}
.day.out{opacity:.4}.day.past{opacity:.35;cursor:default}
.day.fer{background:linear-gradient(var(--fer),var(--fer)),var(--paper)}
.day.hol{background:var(--hol)}.day.pause{background:var(--pause)}
.day.quiet{background:var(--quiet);color:var(--muted)}.day.quiet .tag{color:var(--muted)}.day.quiet .bars{opacity:.55}
.wd.quiet{background:var(--quiet)}.wd.quiet .tl,.wd.quiet .axis{opacity:.55}.chip.quiet{color:var(--muted)}
.dn{font-family:var(--mono);font-size:.8rem}
.tag{font-size:.66rem;color:var(--hol-ink);line-height:1.15;overflow:hidden;text-overflow:ellipsis}
.day.pause .tag{color:var(--ink)}
.bars{display:flex;flex-direction:column;gap:2px;margin-top:auto}
.bars i{position:relative;display:block;height:6px;border-radius:2px}
.cnt{position:absolute;top:5px;right:7px;font-size:.66rem;color:var(--muted)}
/* Woche */
.week{display:flex;flex-direction:column;gap:8px}
.wd{border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--paper)}
.wd.hol{background:var(--hol)}.wd.pause{background:var(--pause)}
.wd h3{margin:0 0 6px;font-size:.95rem;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{font-size:.72rem;font-weight:700;padding:1px 7px;border-radius:4px;background:var(--surface)}
.chip.hol{color:var(--hol-ink);background:transparent;border:1px solid var(--hol-ink)}
.axis,.tl{position:relative;margin-left:0}
.axis{height:16px}
.axis span{position:absolute;transform:translateX(-50%);font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.tl{height:22px;border-radius:3px;background:linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/calc(100%/7) 100%,var(--surface);margin-bottom:3px}
.tl .o{position:absolute;top:2px;bottom:2px;border-radius:3px;background:color-mix(in srgb,var(--c) 22%,transparent);border:1px solid color-mix(in srgb,var(--c) 55%,transparent)}
.tl .c{position:absolute;top:2px;bottom:2px;border-radius:3px;display:flex;align-items:center;overflow:hidden;white-space:nowrap;font-size:.7rem;padding:0 4px;color:#fff}
.tl .c.dk{color:#1a1a1a}
.tl .c.v{color:var(--ink)}
.tl .c span{font-family:var(--mono)}
.tl .c.v span{text-shadow:0 0 2px var(--paper),0 0 3px var(--paper),0 0 4px var(--paper)}
.free{font-size:.85rem;color:var(--muted)}
.pub{font-size:.85rem;margin-top:4px}
.pub a{color:var(--violet);font-weight:700}
.open{font-size:.8rem;color:var(--muted);margin-top:2px}
/* Legende, Fuß */
.legend{display:flex;flex-direction:column;gap:6px;font-size:.8rem;margin:14px 0;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.legend>div{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
footer{font-size:.82rem;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;display:flex;flex-wrap:wrap;gap:6px 18px}
footer a{color:var(--violet)}
@media (max-width:640px){ .day{min-height:62px;padding:3px} .tag{display:none} .tl .c span{display:none} header{flex-wrap:nowrap;gap:12px;padding:10px 12px} .logo{width:132px} header h1{font-size:1.05rem} header h1 small{font-size:.72rem} main{padding:10px 12px 30px} .mv{width:100%} .mv .lab{flex:1;font-size:1rem;min-width:0} .btn{padding:8px 12px} }
</style>
</head>
